{% extends "layout.html" %}

{% block pagetitle  %}Archive{% endblock %}

{% block content %}
<h2>Archive</h2>

{% for post in blog.get_posts() | sort(attribute="date", reverse=True) %}
<p>
	<a href="{{ url_for('post', slug=post.slug()) }}">{{ post.title }}</a> ({{ post.date.date() }})
</p>
{% endfor %}
{% endblock %}
