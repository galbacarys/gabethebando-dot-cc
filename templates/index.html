{% extends "layout.html" %}

{% block pagetitle  %}Home{% endblock %}

{% block content %}
<h1>Latest Posts</h1>

{% for post in blog.get_posts(lim=10) | sort(attribute="date", reverse=True) %}
<p>
	<a href="{{ url_for('post', slug=post.slug()) }}">{{ post.title }}</a> ({{ post.date.date() }})
</p>
{% endfor %}
{% endblock %}
