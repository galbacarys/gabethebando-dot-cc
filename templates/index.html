{% extends "layout.html" %}

{% block title %}Bando, the website{% endblock %}

{% block content %}
<h1>Latest Posts</h1>

{% for post in posts[:10] | sort(attribute="date", reverse=True) %}
	<p>
		<a href="{{ url_for('post', slug=post.slug()) }}">{{ post.title }}</a>
	</p>
{% endfor %}
{% endblock %}
